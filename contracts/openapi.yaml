openapi: 3.1.0
info:
  title: Muduo API
  version: 0.1.0
  description: 木铎笔记模块化单体 MVP 阶段前后端协作 API 契约。
servers:
- url: http://localhost:8000
  description: Local backend
tags:
- name: auth
  description: 登录、刷新 token 和退出登录。
- name: users
  description: 用户资料和偏好设置。
- name: courses
  description: 课程、章节和学习空间。
- name: resources
  description: 上传资源和资源解析。
- name: import-export
  description: 导入导出任务。
- name: workflows
  description: 跨模块编排与联动入口。
- name: ai-tasks
  description: 异步 AI 任务生命周期。
- name: dashboard
  description: 学习仪表盘聚合数据。
- name: notes
- name: memory
- name: thinking
- name: feynman
- name: knowledge_graph
- name: community
- name: workers
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 刷新访问 token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 退出登录
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: 获取当前用户
      operationId: getCurrentUser
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags:
      - users
      summary: 更新当前用户资料
      operationId: updateCurrentUser
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新后的用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/v1/users/me/preferences:
    get:
      tags:
      - users
      summary: 获取当前用户偏好
      operationId: getCurrentUserPreferences
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 用户偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
    patch:
      tags:
      - users
      summary: 更新当前用户偏好
      operationId: updateCurrentUserPreferences
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequest'
      responses:
        '200':
          description: 更新后的用户偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
  /api/v1/courses:
    get:
      tags:
      - courses
      summary: 查询课程列表
      operationId: listCourses
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 课程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags:
      - courses
      summary: 创建课程
      operationId: createCourse
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
  /api/v1/courses/{courseId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      tags:
      - courses
      summary: 查询课程详情
      operationId: getCourse
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 课程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFoundError'
    patch:
      tags:
      - courses
      summary: 更新课程
      operationId: updateCourse
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: 更新后的课程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
    delete:
      tags:
      - courses
      summary: 删除或归档课程
      operationId: deleteCourse
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
  /api/v1/courses/{courseId}/learning-spaces:
    get:
      tags:
      - courses
      summary: 查询课程学习空间列表
      operationId: listLearningSpaces
      security:
      - bearerAuth: []
      parameters:
      - ? ''
        : '#/components/parameters/CourseId'
      - ? ''
        : '#/components/parameters/Page'
      - ? ''
        : '#/components/parameters/PageSize'
      responses:
        '200':
          description: 学习空间列表
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/LearningSpaceListResponse'
        '404':
          ? ''
          : '#/components/responses/ResourceNotFoundError'
    post:
      tags:
      - courses
      summary: 创建课程学习空间
      operationId: createLearningSpace
      security:
      - bearerAuth: []
      parameters:
      - ? ''
        : '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              ? ''
              : '#/components/schemas/LearningSpaceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/LearningSpaceResponse'
        '404':
          ? ''
          : '#/components/responses/ResourceNotFoundError'
  /api/v1/courses/{courseId}/learning-spaces/{spaceId}:
    parameters:
    - ? ''
      : '#/components/parameters/CourseId'
    - ? ''
      : '#/components/parameters/LearningSpaceId'
    get:
      tags:
      - courses
      summary: 查询学习空间详情
      operationId: getLearningSpace
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 学习空间详情
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/LearningSpaceResponse'
        '404':
          ? ''
          : '#/components/responses/ResourceNotFoundError'
    patch:
      tags:
      - courses
      summary: 更新学习空间
      operationId: updateLearningSpace
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              ? ''
              : '#/components/schemas/LearningSpaceUpdateRequest'
      responses:
        '200':
          description: 更新后的学习空间
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/LearningSpaceResponse'
        '404':
          ? ''
          : '#/components/responses/ResourceNotFoundError'
    delete:
      tags:
      - courses
      summary: 删除或归档学习空间
      operationId: deleteLearningSpace
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/EmptyDataResponse'
        '404':
          ? ''
          : '#/components/responses/ResourceNotFoundError'
  /api/v1/resources:
    get:
      tags:
      - resources
      summary: 查询资源列表
      operationId: listResources
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: courseId
        in: query
        required: false
        schema:
          type: string
      - name: learningSpaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 资源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
    post:
      tags:
      - resources
      summary: 登记上传资源
      operationId: createResource
      security:
      - bearerAuth: []
      description: MVP 阶段先登记资源元数据；真实文件上传可后续切换为 multipart 或对象存储直传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: 资源创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '415':
          $ref: '#/components/responses/UnsupportedFileTypeError'
  /api/v1/resources/{resourceId}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - resources
      summary: 查询资源详情
      operationId: getResource
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 资源详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFoundError'
    delete:
      tags:
      - resources
      summary: 删除或归档资源
      operationId: deleteResource
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
  /api/v1/resources/{resourceId}/parse:
    post:
      tags:
      - resources
      summary: 创建资源解析任务
      operationId: createResourceParseTask
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceParseRequest'
      responses:
        '202':
          description: 已创建解析任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAcceptedResponse'
  /api/v1/resources/{resourceId}/parsed-result:
    get:
      tags:
      - resources
      summary: 获取资源解析结果
      operationId: getResourceParsedResult
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedResourceResponse'
  /api/v1/import-jobs:
    post:
      tags:
      - import-export
      summary: 创建资料导入任务
      operationId: createImportJob
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobCreateRequest'
      responses:
        '202':
          description: 已创建导入任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportJobResponse'
  /api/v1/import-jobs/{jobId}:
    get:
      tags:
      - import-export
      summary: 查询资料导入任务
      operationId: getImportJob
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 导入任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportJobResponse'
  /api/v1/export-jobs:
    post:
      tags:
      - import-export
      summary: 创建笔记导出任务
      operationId: createExportJob
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobCreateRequest'
      responses:
        '202':
          description: 已创建导出任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportJobResponse'
  /api/v1/export-jobs/{jobId}:
    get:
      tags:
      - import-export
      summary: 查询笔记导出任务
      operationId: getExportJob
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 导出任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportJobResponse'
  /api/v1/ai-tasks:
    post:
      tags:
      - ai-tasks
      summary: 创建 AI 任务
      operationId: createAiTask
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTaskCreateRequest'
      responses:
        '202':
          description: 已创建 AI 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAcceptedResponse'
  /api/v1/ai-tasks/{taskId}:
    get:
      tags:
      - ai-tasks
      summary: 查询 AI 任务状态
      operationId: getAiTask
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: AI 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskResponse'
    patch:
      tags:
      - ai-tasks
      summary: 更新 AI 任务状态
      operationId: updateAiTask
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTaskUpdateRequest'
      responses:
        '200':
          description: 更新后的 AI 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskResponse'
  /api/v1/ai-tasks/{taskId}/cancel:
    post:
      tags:
      - ai-tasks
      summary: 取消 AI 任务
      operationId: cancelAiTask
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 取消后的任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskResponse'
  /api/v1/ai/openai/chat/completions:
    post:
      tags:
      - ai-tasks
      summary: OpenAI Chat Completions 兼容任务登记
      operationId: createOpenAiChatCompletionTask
      security:
      - bearerAuth: []
      description: 预留 OpenAI Chat Completions 请求形状；MVP 阶段先登记为异步 AI 任务，不直接调用外部模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiChatCompletionRequest'
      responses:
        '202':
          description: 已登记 OpenAI 兼容 AI 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAcceptedResponse'
  /api/v1/workflows/resource-notes/import:
    post:
      tags:
      - workflows
      summary: 创建资源转笔记导入工作流
      operationId: createResourceNoteImport
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobCreateRequest'
      responses:
        '202':
          description: 已创建导入任务和资源解析任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportJobResponse'
  /api/v1/workflows/resource-notes/context:
    get:
      tags:
      - workflows
      summary: 获取资源转笔记上下文
      operationId: getResourceNoteContext
      security:
      - bearerAuth: []
      parameters:
      - name: courseId
        in: query
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 用户、课程、资源、任务和解析结果组合上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceWorkflowContextResponse'
  /api/v1/workflows/resource-notes/parse-tasks/{taskId}/complete:
    post:
      tags:
      - workflows
      summary: 完成资源解析并生成笔记草稿
      operationId: completeResourceParseTask
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteResourceParseRequest'
      responses:
        '200':
          description: 解析结果、任务状态和笔记草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceParseCompletionResponse'
  /api/v1/dashboard/overview:
    get:
      tags:
      - dashboard
      summary: 获取学习仪表盘聚合数据
      operationId: getDashboardOverview
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 仪表盘数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewResponse'
  /api/v1/notes:
    get:
      tags:
      - notes
      summary: List notes owned by current user
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: tag
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Notes list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
    post:
      tags:
      - notes
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
  /api/v1/notes/{noteId}:
    get:
      tags:
      - notes
      summary: Get note detail with blocks and relations
      parameters:
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - notes
      summary: Update a note
      parameters:
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
    delete:
      tags:
      - notes
      summary: Archive a note
      parameters:
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Archived note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
  /api/v1/notes/{noteId}/blocks:
    post:
      tags:
      - notes
      summary: Append a block to a note
      parameters:
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteBlockRequest'
      responses:
        '201':
          description: Created block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteBlockResponse'
  /api/v1/notes/{noteId}/relations:
    post:
      tags:
      - notes
      summary: Link two notes
      parameters:
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRelationRequest'
      responses:
        '201':
          description: Created relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteRelationResponse'
  /api/v1/memory/cards:
    get:
      tags:
      - memory
      summary: List due memory cards
      responses:
        '200':
          description: Due memory cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCardListResponse'
    post:
      tags:
      - memory
      summary: Create a memory card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryCardRequest'
      responses:
        '201':
          description: Created card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCardResponse'
  /api/v1/memory/cards/{cardId}/reviews:
    post:
      tags:
      - memory
      summary: Record a memory card review
      parameters:
      - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRecordRequest'
      responses:
        '201':
          description: Created review record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRecordResponse'
  /api/v1/memory/library:
    get:
      tags:
      - memory
      summary: Get memory library overview for current user
      operationId: getMemoryLibrary
      responses:
        '200':
          description: Memory library data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryLibraryResponse'
  /api/v1/memory/notes/{noteId}/generate:
    post:
      tags:
      - memory
      summary: Generate memory cards from a note using AI
      operationId: generateMemoryCards
      parameters:
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCardsRequest'
      responses:
        '200':
          description: Generated cards
          content:
            application/json:
              schema:
