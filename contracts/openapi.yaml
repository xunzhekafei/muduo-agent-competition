components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    LearningSpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
  responses:
    UnauthorizedError:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResourceNotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedFileTypeError:
      description: 文件格式不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EmptyDataResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
      - code
      - message
      - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Pagination:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - RESOURCE_NOT_FOUND
      - UNAUTHORIZED
      - FORBIDDEN
      - INTERNAL_SERVER_ERROR
      - HTTP_ERROR
      - INVALID_CREDENTIALS
      - TOKEN_EXPIRED
      - UNSUPPORTED_FILE_TYPE
      - RESOURCE_PARSE_FAILED
      - AI_TASK_FAILED
      - IMPORT_EXPORT_FAILED
    UserRole:
      type: string
      enum:
      - student
      - teacher
      - admin
    ResourceType:
      type: string
      enum:
      - pdf
      - ppt
      - markdown
      - image
      - audio
      - video
      - webpage
      - text
      - other
    ResourceStatus:
      type: string
      enum:
      - uploaded
      - parsing
      - parsed
      - failed
      - archived
    AiTaskType:
      type: string
      enum:
      - resource_parse
      - ocr
      - asr
      - llm_summary
      - memory_card_generation
      - feynman_evaluation
      - knowledge_graph_update
      - community_indexing
    AiTaskStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - canceled
    ImportExportJobType:
      type: string
      enum:
      - import
      - export
    ImportExportStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - canceled
    ExportFormat:
      type: string
      enum:
      - markdown
      - pdf
      - json
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    AuthSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: access token 有效秒数
        user:
          $ref: '#/components/schemas/User'
    AuthSessionResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
    User:
      type: object
      required:
      - id
      - name
      - email
      - role
      - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
    UserPreferences:
      type: object
      required:
      - theme
      - language
      - dailyReviewReminder
      - aiGuidanceLevel
      properties:
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        language:
          type: string
          example: zh-CN
        dailyReviewReminder:
          type: boolean
        reminderTime:
          type: string
          nullable: true
          example: '20:00'
        aiGuidanceLevel:
          type: string
          enum:
          - strict
          - balanced
          - gentle
    UserPreferencesResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/UserPreferences'
    UserPreferencesUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/UserPreferences'
    Course:
      type: object
      required:
      - id
      - name
      - subject
      - ownerId
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseCreateRequest:
      type: object
